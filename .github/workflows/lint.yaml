---
name: Lint

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            **/*.yaml
            **/*.yml
      - name: Checkout
        if: steps.changed-files.outputs.changed_files != '[]'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install tools
        if: steps.changed-files.outputs.changed_files != '[]'
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Lint
        if: steps.changed-files.outputs.changed_files != '[]'
        run: just lint yaml

  jsonlint:
    name: JSON
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            **/*.json
            **/*.json5
      - name: Checkout
        if: steps.changed-files.outputs.changed_files != '[]'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install tools
        if: steps.changed-files.outputs.changed_files != '[]'
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Lint
        if: steps.changed-files.outputs.changed_files != '[]'
        run: just lint json

  actionlint:
    name: Actions
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            .github/workflows/*.yaml
            .github/workflows/*.yml
      - name: Checkout
        if: steps.changed-files.outputs.changed_files != '[]'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install tools
        if: steps.changed-files.outputs.changed_files != '[]'
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Lint
        if: steps.changed-files.outputs.changed_files != '[]'
        run: just lint actions

  markdownlint:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            **/*.md
      - name: Checkout
        if: steps.changed-files.outputs.changed_files != '[]'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install tools
        if: steps.changed-files.outputs.changed_files != '[]'
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Lint
        if: steps.changed-files.outputs.changed_files != '[]'
        run: just lint markdown

  renovatelint:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Lint
        run: just lint renovate

  lint-success:
    name: All linters passed
    if: ${{ !cancelled() }}
    needs: [yamllint, jsonlint, actionlint, markdownlint, renovatelint]
    runs-on: ubuntu-latest
    steps:
      - name: Check lint results
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "::error::One or more lint jobs failed"
          exit 1
