---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Validate Manifests

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            kubernetes/**/*

  kustomize:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Kustomize Build
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Validate
        run: just validate kustomize

  helm:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Helm Template
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Validate
        run: just validate helm

  images:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Verify Images
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Validate
        run: just validate images

  validate-success:
    name: All validations passed
    if: ${{ !cancelled() }}
    needs: [kustomize, helm, images]
    runs-on: ubuntu-latest
    steps:
      - name: Check validation results
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "::error::One or more validation jobs failed"
          exit 1
