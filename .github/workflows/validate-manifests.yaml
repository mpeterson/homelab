---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Validate Manifests

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            kubernetes/**/*

  kustomize:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Kustomize Build
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Validate
        run: just validate kustomize

  helm:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Helm Template
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Validate
        run: just validate helm

  images:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Verify Images
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Validate
        run: just validate images

  validate-success:
    name: All validations passed
    if: ${{ !cancelled() }}
    needs: [kustomize, helm, images]
    runs-on: ubuntu-latest
    steps:
      - name: Check validation results
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "::error::One or more validation jobs failed"
          exit 1
