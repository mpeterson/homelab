---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: &app plex-auto-languages
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  info:
    - name: Chart
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts depName=app-template
      value: app-template@5.0.1
    - name: Image
      # renovate: datasource=docker depName=ghcr.io/journeydocker/plex-auto-languages
      value: ghcr.io/journeydocker/plex-auto-languages:1.6.0@sha256:9b00a7877f9f85e0228a5d9aa3df5e6671f1116f1e9a8654e9d3f8ed40f2d694

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      selfHeal: true
      prune: true

  source:
    repoURL: https://github.com/mpeterson/homelab
    path: kubernetes/apps/plex-auto-languages/
    targetRevision: main
