# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-3.7.3/charts/library/common/values.schema.json
---
strategy: RollingUpdate

controllers:
  qbittorrent:
    replicas: 1
    pod:
      securityContext:
        runAsUser: 65534
        runAsGroup: 100
        fsGroup: 65534
        fsGroupChangePolicy: "OnRootMismatch"

    initContainers:
      configure-webui:
        image:
          repository: &image ghcr.io/home-operations/qbittorrent
          tag: &tag 5.3.0@sha256:faa37907a4242c6c3c5fdd3f7ea95e0c2308534406f4d606ba64d816e764d39f
        env:
          QBT_USERNAME:
            valueFrom:
              secretKeyRef:
                name: cross-seed-secret
                key: qbt_username
          QBT_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: cross-seed-secret
                key: qbt_password
        command:
          - python3
          - /scripts/configure-webui.py
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}

    containers:
      app:
        image:
          repository: *image
          tag: *tag
        env:
          TZ: Asia/Jerusalem
          QBT_WEBUI_PORT: &port 80
          QBT_TORRENTING_PORT: &torrentPort 50413
          XSEED_HOST: cross-seed.media.svc.cluster.local
          XSEED_PORT: 2468
          XSEED_APIKEY:
            valueFrom:
              secretKeyRef:
                name: cross-seed-secret
                key: xseed_api_key
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 10m
            memory: 250Mi
          limits:
            memory: 2Gi

service:
  app:
    controller: qbittorrent
    type: LoadBalancer
    annotations:
      io.cilium/lb-ipam-ips: 10.3.1.6
    ports:
      http:
        port: *port
        primary: true
      bittorrent:
        port: *torrentPort
        protocol: TCP

route:
  app:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - qbittorrent.lan.peterson.com.ar
    parentRefs:
      - kind: Gateway
        name: internal-gateway
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - name: qbittorrent
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    storageClass: zfs-generic-iscsi-csi-xfs
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      qbittorrent:
        configure-webui:
          - path: /config
        app:
          - path: /config
  downloads:
    type: nfs
    server: nas.lan.peterson.com.ar
    path: /nibbler/media/library/
    advancedMounts:
      qbittorrent:
        app:
          - path: /data/downloads/torrents
            subPath: downloads/torrents
          - path: /data/incomplete-downloads/torrents
            subPath: incomplete-downloads/torrents
  temp:
    type: emptyDir
    advancedMounts:
      qbittorrent:
        app:
          - path: /tmp
  scripts:
    type: configMap
    name: qbittorrent-scripts
    defaultMode: 0775
    advancedMounts:
      qbittorrent:
        configure-webui:
          - path: /scripts
            readOnly: true
        app:
          - path: /config/scripts
