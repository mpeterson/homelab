# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-3.7.3/charts/library/common/values.schema.json
---
strategy: RollingUpdate

controllers:
  kometa:
    type: cronjob

    cronjob:
      schedule: "@daily"
      backoffLimit: 0
      timeZone: &tz Asia/Jerusalem
      concurrencyPolicy: Forbid
      failedJobsHistory: 3
      successfulJobsHistory: 3

    pod:
      securityContext:
        runAsUser: 65534
        runAsGroup: 100
        runAsNonRoot: true
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch

    containers:
      app:
        image:
          repository: kometateam/kometa
          tag: v2.5.5@sha256:864cec57d099c71a26a5a5ce2784d34d9b53874c91269c3a12df3949eab96562
        command:
          - python3
        args:
          - /config/run.py
        env:
          TZ: *tz
        envFrom:
          - secretRef:
              name: kometa-secret
        resources:
          requests:
            cpu: 10m
            memory: 1Gi
          limits:
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}

persistence:
  config:
    storageClass: zfs-generic-iscsi-csi-xfs
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /config
  config-file:
    type: configMap
    name: kometa-configmap
    globalMounts:
      - path: /config/config.yml
        subPath: config.yml
        readOnly: true
      - path: /config/run.py
        subPath: run.py
        readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
