---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: &app bar-assistant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: selfhosted

  info:
    - name: Chart
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts depName=app-template
      value: app-template@4.6.2
    - name: Server Image
      # renovate: datasource=docker depName=barassistant/server
      value: barassistant/server:6.11.1@sha256:545abe1a84c8d33255877297c75d87c0aa4e66598b074309ee40d6977ea665c8
    - name: Web Image
      # renovate: datasource=docker depName=barassistant/salt-rim
      value: barassistant/salt-rim:5.10.1@sha256:8ed9c33bbb5ec330ae6ad4a7c498282fdb27ecc643e8320c753ae35e39f27394
    - name: Search Image
      # renovate: datasource=docker depName=getmeili/meilisearch
      value: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    - name: Cache Image
      # renovate: datasource=docker depName=valkey/valkey
      value: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      selfHeal: true
      prune: true

  source:
    repoURL: https://github.com/mpeterson/homelab
    path: kubernetes/apps/bar-assistant/
    targetRevision: main
