---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: &app bar-assistant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: selfhosted

  info:
    - name: Chart
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts depName=app-template
      value: app-template@4.6.2
    - name: Server Image
      # renovate: datasource=docker depName=barassistant/server
      value: barassistant/server:6.12.1@sha256:2c52dd9858d7b4206159bb36f9febf22d19b025fda0b7d4fb9f2482a7d361a0b
    - name: Web Image
      # renovate: datasource=docker depName=barassistant/salt-rim
      value: barassistant/salt-rim:5.11.0@sha256:7aa57a94f7cd8b2456c44881254937d28e0b5ed897e299b05a4624ca7d822317
    - name: Search Image
      # renovate: datasource=docker depName=getmeili/meilisearch
      value: getmeili/meilisearch:v1.57.0@sha256:91bf09897482c17205c8faeca8daa8d57999fb9de20d862763cdfa92ba4ec790
    - name: Cache Image
      # renovate: datasource=docker depName=valkey/valkey
      value: valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      selfHeal: true
      prune: true

  source:
    repoURL: https://github.com/mpeterson/homelab
    path: kubernetes/apps/bar-assistant/
    targetRevision: main
