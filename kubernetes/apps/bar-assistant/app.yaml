---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: &app bar-assistant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: selfhosted

  info:
    - name: Chart
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts depName=app-template
      value: app-template@4.6.2
    - name: Server Image
      # renovate: datasource=docker depName=barassistant/server
      value: barassistant/server:6.13.1@sha256:4117a0e73c94b505557683118c134f7f011b6719e546f062687331e44df5774e
    - name: Web Image
      # renovate: datasource=docker depName=barassistant/salt-rim
      value: barassistant/salt-rim:5.12.0@sha256:7d40a6b98cfac7fb0b82e28a082c168c5219fbcba739a5590d8b74065bd35782
    - name: Search Image
      # renovate: datasource=docker depName=getmeili/meilisearch
      value: getmeili/meilisearch:v1.58.0@sha256:cee0d2e31191594ff8e1651eb144aabd95b389a0bc3532327ecfb9ed91dffe7e
    - name: Cache Image
      # renovate: datasource=docker depName=valkey/valkey
      value: valkey/valkey:9.2.1-alpine@sha256:3ad5a213cb1bc2fd4a113c89b6248a88655a6bf1dda69519d04e03cd3e3d2742

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      selfHeal: true
      prune: true

  source:
    repoURL: https://github.com/mpeterson/homelab
    path: kubernetes/apps/bar-assistant/
    targetRevision: main
