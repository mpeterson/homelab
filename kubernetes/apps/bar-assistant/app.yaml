---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: &app bar-assistant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: selfhosted

  info:
    - name: Chart
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts depName=app-template
      value: app-template@4.6.2
    - name: Server Image
      # renovate: datasource=docker depName=barassistant/server
      value: barassistant/server:6.10.1@sha256:19baac04e5b8db79c36797426deaf7f1e817cc081211ab92b23cc9d4a5a8131a
    - name: Web Image
      # renovate: datasource=docker depName=barassistant/salt-rim
      value: barassistant/salt-rim:5.9.0@sha256:cd943a2c9453ff5496f5a1cffd4b3163b0e8a01b1b060f8e7bbd520895a79c5e
    - name: Search Image
      # renovate: datasource=docker depName=getmeili/meilisearch
      value: getmeili/meilisearch:v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
    - name: Cache Image
      # renovate: datasource=docker depName=valkey/valkey
      value: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      selfHeal: true
      prune: true

  source:
    repoURL: https://github.com/mpeterson/homelab
    path: kubernetes/apps/bar-assistant/
    targetRevision: main
