# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-3.7.3/charts/library/common/values.schema.json
---
strategy: RollingUpdate

controllers:
  api:
    replicas: 1
    pod:
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: barassistant/server
          tag: 6.12.1@sha256:2c52dd9858d7b4206159bb36f9febf22d19b025fda0b7d4fb9f2482a7d361a0b
        env:
          ALLOW_REGISTRATION: "true"
          APP_KEY:
            valueFrom:
              secretKeyRef:
                name: bar-assistant-secret
                key: APP_KEY
          APP_URL: https://bar-api.lan.peterson.com.ar
          CACHE_DRIVER: redis
          LOG_CHANNEL: stderr
          LOG_LEVEL: warning
          MEILISEARCH_HOST: http://bar-assistant-search.selfhosted.svc.cluster.local:7700
          MEILISEARCH_KEY:
            valueFrom:
              secretKeyRef:
                name: bar-assistant-secret
                key: MEILI_MASTER_KEY
          REDIS_HOST: bar-assistant-cache.selfhosted.svc.cluster.local
          SESSION_DRIVER: redis
          SESSION_SECURE_COOKIE: "true"
          TZ: Asia/Jerusalem
        probes:
          liveness: &apiProbes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthcheck
                port: &apiPort 8080
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          readiness: *apiProbes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthcheck
                port: *apiPort
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            memory: 1Gi

  app:
    replicas: 1
    containers:
      app:
        image:
          repository: barassistant/salt-rim
          tag: 5.11.0@sha256:7aa57a94f7cd8b2456c44881254937d28e0b5ed897e299b05a4624ca7d822317
        env:
          ALLOW_REGISTRATION: "true"
          API_URL: https://bar-api.lan.peterson.com.ar
          DEFAULT_LOCALE: en
          MEILISEARCH_URL: https://bar-search.lan.peterson.com.ar
          SALT_RIM_ENV: production
        probes:
          liveness: &appProbes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &appPort 8080
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *appProbes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *appPort
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 12
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi

  search:
    replicas: 1
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: getmeili/meilisearch
          tag: v1.57.0@sha256:91bf09897482c17205c8faeca8daa8d57999fb9de20d862763cdfa92ba4ec790
        env:
          MEILI_ENV: production
          MEILI_MASTER_KEY:
            valueFrom:
              secretKeyRef:
                name: bar-assistant-secret
                key: MEILI_MASTER_KEY
          MEILI_NO_ANALYTICS: "true"
          MEILI_UPGRADE_DB: "true"
        probes:
          liveness: &searchProbes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &searchPort 7700
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *searchProbes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *searchPort
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 12
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 1Gi

  cache:
    replicas: 1
    containers:
      app:
        image:
          repository: valkey/valkey
          tag: 9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
        probes:
          liveness: &cacheProbes
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: &cachePort 6379
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *cacheProbes
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi

service:
  api:
    controller: api
    ports:
      http:
        port: *apiPort
  app:
    primary: true
    controller: app
    ports:
      http:
        port: *appPort
  search:
    controller: search
    ports:
      http:
        port: *searchPort
  cache:
    controller: cache
    ports:
      redis:
        port: *cachePort

route:
  api:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - bar-api.lan.peterson.com.ar
    parentRefs:
      - kind: Gateway
        name: internal-gateway
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - name: bar-assistant-api
            port: *apiPort
        matches:
          - path:
              type: PathPrefix
              value: /
  app:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - bar.lan.peterson.com.ar
    parentRefs:
      - kind: Gateway
        name: internal-gateway
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - name: bar-assistant-app
            port: *appPort
        matches:
          - path:
              type: PathPrefix
              value: /
  search:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - bar-search.lan.peterson.com.ar
    parentRefs:
      - kind: Gateway
        name: internal-gateway
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - name: bar-assistant-search
            port: *searchPort
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    storageClass: zfs-generic-iscsi-csi-xfs
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      api:
        app:
          - path: /var/www/cocktails/storage/bar-assistant
  search:
    storageClass: zfs-generic-iscsi-csi-xfs
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      search:
        app:
          - path: /meili_data
