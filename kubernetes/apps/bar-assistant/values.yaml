# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-3.7.3/charts/library/common/values.schema.json
---
strategy: RollingUpdate

controllers:
  api:
    replicas: 1
    pod:
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: barassistant/server
          tag: 6.11.1@sha256:545abe1a84c8d33255877297c75d87c0aa4e66598b074309ee40d6977ea665c8
        env:
          ALLOW_REGISTRATION: "true"
          APP_KEY:
            valueFrom:
              secretKeyRef:
                name: bar-assistant-secret
                key: APP_KEY
          APP_URL: https://bar-api.lan.peterson.com.ar
          CACHE_DRIVER: redis
          LOG_CHANNEL: stderr
          LOG_LEVEL: warning
          MEILISEARCH_HOST: http://bar-assistant-search.selfhosted.svc.cluster.local:7700
          MEILISEARCH_KEY:
            valueFrom:
              secretKeyRef:
                name: bar-assistant-secret
                key: MEILI_MASTER_KEY
          REDIS_HOST: bar-assistant-cache.selfhosted.svc.cluster.local
          SESSION_DRIVER: redis
          SESSION_SECURE_COOKIE: "true"
          TZ: Asia/Jerusalem
        probes:
          liveness: &apiProbes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthcheck
                port: &apiPort 8080
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          readiness: *apiProbes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthcheck
                port: *apiPort
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            memory: 1Gi

  app:
    replicas: 1
    containers:
      app:
        image:
          repository: barassistant/salt-rim
          tag: 5.10.1@sha256:8ed9c33bbb5ec330ae6ad4a7c498282fdb27ecc643e8320c753ae35e39f27394
        env:
          ALLOW_REGISTRATION: "true"
          API_URL: https://bar-api.lan.peterson.com.ar
          DEFAULT_LOCALE: en
          MEILISEARCH_URL: https://bar-search.lan.peterson.com.ar
          SALT_RIM_ENV: production
        probes:
          liveness: &appProbes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &appPort 8080
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *appProbes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *appPort
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 12
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi

  search:
    replicas: 1
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: getmeili/meilisearch
          tag: v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
        env:
          MEILI_ENV: production
          MEILI_MASTER_KEY:
            valueFrom:
              secretKeyRef:
                name: bar-assistant-secret
                key: MEILI_MASTER_KEY
          MEILI_NO_ANALYTICS: "true"
          MEILI_UPGRADE_DB: "true"
        probes:
          liveness: &searchProbes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &searchPort 7700
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *searchProbes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *searchPort
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 12
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 1Gi

  cache:
    replicas: 1
    containers:
      app:
        image:
          repository: valkey/valkey
          tag: 9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        probes:
          liveness: &cacheProbes
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: &cachePort 6379
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *cacheProbes
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi

service:
  api:
    controller: api
    ports:
      http:
        port: *apiPort
  app:
    primary: true
    controller: app
    ports:
      http:
        port: *appPort
  search:
    controller: search
    ports:
      http:
        port: *searchPort
  cache:
    controller: cache
    ports:
      redis:
        port: *cachePort

route:
  api:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - bar-api.lan.peterson.com.ar
    parentRefs:
      - kind: Gateway
        name: internal-gateway
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - name: bar-assistant-api
            port: *apiPort
        matches:
          - path:
              type: PathPrefix
              value: /
  app:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - bar.lan.peterson.com.ar
    parentRefs:
      - kind: Gateway
        name: internal-gateway
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - name: bar-assistant-app
            port: *appPort
        matches:
          - path:
              type: PathPrefix
              value: /
  search:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - bar-search.lan.peterson.com.ar
    parentRefs:
      - kind: Gateway
        name: internal-gateway
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - name: bar-assistant-search
            port: *searchPort
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    storageClass: zfs-generic-iscsi-csi-xfs
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      api:
        app:
          - path: /var/www/cocktails/storage/bar-assistant
  search:
    storageClass: zfs-generic-iscsi-csi-xfs
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      search:
        app:
          - path: /meili_data
