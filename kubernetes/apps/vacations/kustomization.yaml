---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: &ns vacations

resources:
  - networkpolicy.yaml

# Add this after creating the encrypted secrets documented in README.md.
# generators:
#   - secret-generator.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts depName=app-template
    version: 4.6.2
    releaseName: vacations
    namespace: *ns
    valuesFile: values.yaml
