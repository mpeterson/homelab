# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-3.7.3/charts/library/common/values.schema.json
---
strategy: RollingUpdate

controllers:
  vacations:
    # The first verified image promotion enables this controller.
    enabled: &workloadsEnabled false
    replicas: 2

    pod:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: vacations-ghcr
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    containers:
      app:
        # Promotion automation manages the digest-pinned image.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 30
              timeoutSeconds: 2
              failureThreshold: 3
          readiness: &appProbe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /build-info.json
                port: 8080
              initialDelaySeconds: 2
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
          startup:
            <<: *appProbe
            spec:
              httpGet:
                path: /build-info.json
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 2
              timeoutSeconds: 2
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi

  cloudflared:
    # The first verified image promotion enables this controller.
    enabled: *workloadsEnabled
    replicas: 2

    pod:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    containers:
      tunnel:
        image:
          repository: cloudflare/cloudflared
          tag: 2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
        args:
          - tunnel
          - --no-autoupdate
          - --loglevel
          - info
          - --output
          - json
          - --metrics
          - 0.0.0.0:2000
          - run
        env:
          TUNNEL_TOKEN:
            valueFrom:
              secretKeyRef:
                name: vacations-cloudflared
                key: TUNNEL_TOKEN
        probes:
          liveness: &tunnelProbe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: 2000
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
          readiness:
            <<: *tunnelProbe
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi

service:
  app:
    enabled: *workloadsEnabled
    controller: vacations
    type: ClusterIP
    ports:
      http:
        port: 8080

persistence:
  app-tmp:
    enabled: *workloadsEnabled
    type: emptyDir
    advancedMounts:
      vacations:
        app:
          - path: /tmp

  app-cache:
    enabled: *workloadsEnabled
    type: emptyDir
    advancedMounts:
      vacations:
        app:
          - path: /var/cache/nginx

  app-run:
    enabled: *workloadsEnabled
    type: emptyDir
    advancedMounts:
      vacations:
        app:
          - path: /var/run

  tunnel-tmp:
    enabled: *workloadsEnabled
    type: emptyDir
    advancedMounts:
      cloudflared:
        tunnel:
          - path: /tmp
