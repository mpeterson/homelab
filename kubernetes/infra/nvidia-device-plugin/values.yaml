---
operator:
  runtimeClass: nvidia
  upgradeCRD: false

driver:
  enabled: false

toolkit:
  enabled: false

hostPaths:
  driverInstallDir: /usr/local

nfd:
  enabled: false

devicePlugin:
  config:
    create: true
    name: nvidia-device-plugin-config
    default: default
    data:
      default: |-
        version: v1
        flags:
          migStrategy: none
        sharing:
          timeSlicing:
            resources:
              - name: nvidia.com/gpu
                replicas: 8
