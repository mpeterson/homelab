---
driver:
  enabled: false

toolkit:
  enabled: false

nfd:
  enabled: false

hostPaths:
  driverInstallDir: /usr/local

devicePlugin:
  config:
    create: true
    name: time-slicing-config
    default: default
    data:
      default: |-
        version: v1
        sharing:
          timeSlicing:
            resources:
              - name: nvidia.com/gpu
                replicas: 8
