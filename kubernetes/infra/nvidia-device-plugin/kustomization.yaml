---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: &ns infra

resources:
  - runtimeclass.yaml

helmCharts:
  - name: gpu-operator
    repo: https://helm.ngc.nvidia.com/nvidia
    # renovate: datasource=helm registryUrl=https://helm.ngc.nvidia.com/nvidia depName=gpu-operator
    version: v26.7.2
    releaseName: gpu-operator
    namespace: *ns
    includeCRDs: true
    valuesFile: values.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: gpu-operator-cleanup-gpucluster
        namespace: infra
