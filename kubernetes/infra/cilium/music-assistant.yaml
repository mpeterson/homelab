---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-assistant-route
  namespace: network
spec:
  parentRefs:
    - name: public-gateway
      namespace: network
      sectionName: https
  hostnames:
    - music-assistant.peterson.com.ar
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s
      backendRefs:
        - name: music-assistant-external
          port: 8095
          weight: 1
