---
alertmanager:
  tplConfig: false
  config:
    route:
      receiver: monitoring/alertmanager/pushover
      group_by:
        - alertname
        - job
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 6h
      routes:
        - receiver: monitoring/alertmanager/null
          matchers:
            - alertname="KubeJobFailed"
            - namespace="velero"
            - job_name=~".*-maintain-job-.*"
        - receiver: monitoring/alertmanager/null
          matchers:
            - alertname=~"KubeJobFailed|KubeJobNotCompleted"
            - namespace="media"
            - job_name=~"kometa-.+"
        - receiver: monitoring/alertmanager/healthcheck-canary
          matchers:
            - alertname="Watchdog"
          repeat_interval: 5m
          group_interval: 1m
        - receiver: monitoring/alertmanager/pushover
          matchers:
            - alertname=~"KometaRunFailed|KometaRunStale"
            - namespace="media"
          routes:
            - receiver: monitoring/alertmanager/pushover
              matchers:
                - severity="critical"
            - receiver: monitoring/alertmanager/pushover
              active_time_intervals:
                - normal-hours
        - receiver: monitoring/alertmanager/pushover
          matchers:
            - severity="critical"
          continue: true

    time_intervals:
      - name: normal-hours
        time_intervals:
          - weekdays: ["sunday:thursday"]
            times:
              - start_time: "09:00"
                end_time: "22:00"
            location: Asia/Jerusalem
          - weekdays: ["friday:saturday"]
            times:
              - start_time: "10:00"
                end_time: "22:00"
            location: Asia/Jerusalem

    inhibit_rules:
      - equal:
          - alertname
          - namespace
        source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"

    receivers:
      - name: monitoring/alertmanager/null
      - name: monitoring/alertmanager/healthcheck-canary
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-secrets/healthcheck_canary_url
            send_resolved: false
      - name: monitoring/alertmanager/pushover
        pushover_configs:
          - html: true
            monospace: false
            token_file: /etc/alertmanager/secrets/alertmanager-secrets/pushover_api_token
            user_key_file: /etc/alertmanager/secrets/alertmanager-secrets/pushover_api_userkey
            send_resolved: true
            sound: gamelan
            ttl: 86400s
            priority: '{{ if eq .Status "firing" }}1{{ else }}0{{ end }}'
            url_title: View in Alert Manager
            title: >-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
            message: |-
              {{- range .Alerts }}
                {{- if ne .Annotations.description "" }}
                  {{ .Annotations.description }}
                {{- else if ne .Annotations.summary "" }}
                  {{ .Annotations.summary }}
                {{- else if ne .Annotations.message "" }}
                  {{ .Annotations.message }}
                {{- else }}
                  Alert description not available
                {{- end }}
                {{- if gt (len .Labels.SortedPairs) 0 }}
                  <small>
                    {{- range .Labels.SortedPairs }}
                      <b>{{ .Name }}:</b> {{ .Value }}
                    {{- end }}
                  </small>
                {{- end }}
              {{- end }}
