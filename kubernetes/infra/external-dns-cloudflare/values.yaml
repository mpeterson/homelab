---
fullnameOverride: external-dns-cloudflare

image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3

provider:
  name: cloudflare

sources:
  - gateway-httproute

domainFilters:
  - peterson.com.ar

excludeDomains:
  - lan.peterson.com.ar

policy: sync
registry: txt
txtOwnerId: homelab-cloudflare
txtPrefix: _edns.

extraArgs:
  - --default-targets=ashton.peterson.com.ar
  - --force-default-targets
  - --gateway-label-filter=external-dns/zone=public

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cloudflare-secret
        key: api-token

serviceMonitor:
  enabled: true
