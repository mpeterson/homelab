---
fullnameOverride: external-dns-cloudflare

image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9

provider:
  name: cloudflare

sources:
  - gateway-httproute

domainFilters:
  - peterson.com.ar

excludeDomains:
  - lan.peterson.com.ar

policy: sync
registry: txt
txtOwnerId: homelab-cloudflare
txtPrefix: _edns.

extraArgs:
  - --default-targets=ashton.peterson.com.ar
  - --force-default-targets
  - --gateway-label-filter=external-dns/zone=public

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cloudflare-secret
        key: api-token

serviceMonitor:
  enabled: true
