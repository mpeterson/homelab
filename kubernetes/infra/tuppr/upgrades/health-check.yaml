---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iscsi-health-check
spec:
  selector:
    matchLabels:
      app: iscsi-health-check
  template:
    metadata:
      labels:
        app: iscsi-health-check
      annotations:
        backup.velero.io/backup-volumes-excludes: data
    spec:
      # No CP toleration — iSCSI CSI driver only runs on worker nodes
      containers:
        - name: probe
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - |
              while true; do
                date > /data/health && cat /data/health > /dev/null
                sleep 30
              done
          readinessProbe:
            exec:
              command: ["sh", "-c", "cat /data/health"]
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  velero.io/exclude-from-backup: "true"
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: zfs-generic-iscsi-csi-xfs
                resources:
                  requests:
                    storage: 512Mi
