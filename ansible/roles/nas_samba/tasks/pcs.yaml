---
- name: Detect PCS designated controller (active node)
  ansible.builtin.command:
    argv:
      - pcs
      - status
  register: _pcs_status
  changed_when: false
  check_mode: false
  run_once: true
  when: nas_samba_pcs_enabled

- name: Validate PCS designated controller
  ansible.builtin.assert:
    that:
      - >-
        (
          _pcs_status.stdout
          | regex_findall('Current DC: ([^ ]+)')
          | reject('equalto', 'NONE')
          | list
          | length
        ) == 1
    fail_msg: Unable to determine the PCS designated controller.
  run_once: true
  when: nas_samba_pcs_enabled

- name: Set active node fact
  ansible.builtin.set_fact:
    _pcs_active_node: >-
      {{
        _pcs_status.stdout
        | regex_findall('Current DC: ([^ ]+)')
        | first
      }}
  run_once: true
  when: nas_samba_pcs_enabled

- name: Check if PCS resource already exists
  ansible.builtin.shell: >
    pcs resource status {{ nas_samba_pcs_resource_name }} ||
    pcs resource config {{ nas_samba_pcs_resource_name }}
  register: _pcs_resource_check
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when: nas_samba_pcs_enabled

- name: Read existing PCS resource configuration
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - config
      - "{{ nas_samba_pcs_resource_name }}"
      - --output-format=cmd
  register: _pcs_resource_config
  changed_when: false
  check_mode: false
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when:
    - nas_samba_pcs_enabled
    - _pcs_resource_check.rc == 0

- name: Validate existing PCS resource configuration
  ansible.builtin.assert:
    that:
      - (nas_samba_pcs_resource_name ~ ' systemd:smb') in _pcs_resource_config.stdout
      - >-
        (
          _pcs_resource_config.stdout
          | regex_search(
              '(?m)^\s+monitor\s+[^\n]*interval='
              ~ (nas_samba_pcs_monitor_interval | regex_escape)
              ~ '(\s|$)'
            )
        ) is not none
      - >-
        (
          _pcs_resource_config.stdout
          | regex_search(
              '(?m)^\s+start\s+[^\n]*timeout='
              ~ (nas_samba_pcs_start_timeout | regex_escape)
              ~ '(\s|$)'
            )
        ) is not none
      - >-
        (
          _pcs_resource_config.stdout
          | regex_search(
              '(?m)^\s+stop\s+[^\n]*timeout='
              ~ (nas_samba_pcs_stop_timeout | regex_escape)
              ~ '(\s|$)'
            )
        ) is not none
    fail_msg: >-
      Existing PCS resource '{{ nas_samba_pcs_resource_name }}' differs from
      the configured agent or operation settings. The role will not rewrite a
      live resource automatically; reconcile it explicitly before continuing.
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when:
    - nas_samba_pcs_enabled
    - _pcs_resource_check.rc == 0

- name: Create stopped PCS resource for Samba
  ansible.builtin.command: >
    pcs resource create {{ nas_samba_pcs_resource_name }} systemd:smb
    op start timeout={{ nas_samba_pcs_start_timeout }}
    op stop timeout={{ nas_samba_pcs_stop_timeout }}
    op monitor interval={{ nas_samba_pcs_monitor_interval }}
    meta target-role=Stopped
  register: _pcs_resource_create
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when:
    - nas_samba_pcs_enabled
    - _pcs_resource_check.rc != 0

- name: Read PCS constraints
  ansible.builtin.command:
    argv:
      - pcs
      - constraint
      - config
      - --output-format=cmd
  register: _pcs_constraints
  changed_when: false
  check_mode: false
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when: nas_samba_pcs_enabled

- name: Index PCS constraints involving Samba
  ansible.builtin.set_fact:
    _pcs_expected_colocation: >-
      constraint colocation add {{ nas_samba_pcs_resource_name }}
      with {{ nas_samba_pcs_group }} INFINITY
    _pcs_expected_order: >-
      constraint order start {{ nas_samba_pcs_group }}
      then start {{ nas_samba_pcs_resource_name }}
    _pcs_samba_colocations: >-
      {{
        _pcs_constraints.stdout_lines
        | select('search', 'constraint colocation add')
        | select('search', nas_samba_pcs_resource_name | regex_escape)
        | list
      }}
    _pcs_samba_orders: >-
      {{
        _pcs_constraints.stdout_lines
        | select('search', 'constraint order')
        | select('search', nas_samba_pcs_resource_name | regex_escape)
        | list
      }}
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when: nas_samba_pcs_enabled

- name: Validate existing Samba constraints
  ansible.builtin.assert:
    that:
      - _pcs_expected_colocation in _pcs_constraints.stdout or _pcs_samba_colocations | length == 0
      - _pcs_expected_order in _pcs_constraints.stdout or _pcs_samba_orders | length == 0
    fail_msg: >-
      Existing PCS constraints involving '{{ nas_samba_pcs_resource_name }}'
      differ from the configured group or policy. The role will not replace
      live constraints automatically; reconcile them explicitly first.
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when: nas_samba_pcs_enabled

- name: Add colocation constraint (Samba runs on same node as group)
  ansible.builtin.command: >
    pcs constraint colocation add {{ nas_samba_pcs_resource_name }}
    with {{ nas_samba_pcs_group }} INFINITY
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when:
    - nas_samba_pcs_enabled
    - _pcs_expected_colocation not in _pcs_constraints.stdout

- name: Add ordering constraint (group starts before Samba)
  ansible.builtin.command: >
    pcs constraint order {{ nas_samba_pcs_group }}
    then {{ nas_samba_pcs_resource_name }}
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when:
    - nas_samba_pcs_enabled
    - _pcs_expected_order not in _pcs_constraints.stdout

- name: Enable newly created PCS resource
  ansible.builtin.command: >
    pcs resource enable {{ nas_samba_pcs_resource_name }}
  delegate_to: "{{ _pcs_active_node }}"
  run_once: true
  when:
    - nas_samba_pcs_enabled
    - _pcs_resource_create is changed
